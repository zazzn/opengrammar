name: CI

on:
  push:
    branches: [ main, og-rewrite ]
  pull_request:
    branches: [ main, og-rewrite ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, typecheck, build (extension)
        working-directory: opengrammar/extension
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

      - name: Brand residue gate
        run: |
          cd opengrammar/extension/src
          if grep -rliE '#4f46e5|#7c3aed|#2563eb|family=Inter' popup options content styles; then
            echo "::error::Old OpenGrammar brand residue found (indigo / Inter). Run the green token system."
            exit 1
          fi
          echo "Brand gate clean."
